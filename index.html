<style>
/* Layout: phone = one column with sticky swipeable day tabs; laptop (>=1000px) = sticky day sidebar + wide content with place cards in a grid. */
:root {
  --bg: #f6f2ea;          /* 和紙 cream */
  --surface: #fffdf9;
  --ink: #2a2622;
  --muted: #6d655c;
  --line: #e6dfd3;
  --indigo: #2f5596;      /* 藍染 */

  --ok: #2f7a4f;
  --warn: #9a6a00;
  --font: "Huninn";
  --fallback: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --display: var(--font), var(--fallback);
  --body: var(--font), var(--fallback);
  --radius: 14px;
  --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 4px 14px rgba(60, 40, 20, .05);
}
:root[data-font="chiron"] { --font: "Chiron GoRound TC"; }
:root[data-font="wenkai"] { --font: "LXGW WenKai TC"; }
:root[data-font="iansui"] { --font: "Iansui"; }
:root[data-font="noto"]   { --font: "Noto Sans TC"; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151d; --surface: #1a202b; --ink: #ece8e1; --muted: #a7a095; --line: #2c3442;
  --indigo: #9ab8f0; --indigo-soft: #1f2b43; --shu: #f39a7c; --shu-soft: #35231d;
  --ok: #72d39b; --warn: #e6b955; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151d; --surface: #1a202b; --ink: #ece8e1; --muted: #a7a095; --line: #2c3442;
  --indigo: #9ab8f0; --indigo-soft: #1f2b43; --shu: #f39a7c; --shu-soft: #35231d;
  --ok: #72d39b; --warn: #e6b955; --shadow: none; color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16.5px; line-height: 1.7; letter-spacing: .02em; transition: background-color .2s, color .2s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--indigo); }
img { max-width: 100%; }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--shu); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 14px 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.top h1 { font-family: var(--display); font-size: 1.55rem; margin: 0; letter-spacing: .06em; line-height: 1.3; }
.top h1 .seal { display: inline-block; background: var(--shu); color: #fff; font-size: .68rem; padding: 2px 7px; border-radius: 6px; vertical-align: 5px; margin-left: 8px; letter-spacing: .1em; }
.top p { margin: 2px 0 0; color: var(--muted); font-size: .88rem; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tool { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 99px; padding: 6px 14px; font: inherit; font-size: .88rem; cursor: pointer; min-height: 40px; }
.tool:hover { border-color: var(--indigo); }
.tool select { border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; padding: 0; }
.tool .ic { font-size: 1.05rem; line-height: 1; }
@media (max-width: 559px) { .tools { width: 100%; flex-wrap: nowrap; } .tool:has(select) { flex: 1; min-width: 0; } .tool select { width: 100%; } .tool .lb { display: none; } }

/* layout */
.layout { max-width: 1240px; margin: 0 auto; }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.tablist { display: flex; gap: 6px; overflow-x: auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)); scrollbar-width: none; scroll-behavior: smooth; }
.tablist::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 6px 10px; font: inherit; font-size: .85rem; line-height: 1.3; cursor: pointer; text-align: center; min-width: 60px; }
.tab b { display: block; font-size: .98rem; font-variant-numeric: tabular-nums; }
.tab small { color: var(--muted); font-size: .74rem; }
.tab .along { display: none; }
.tab[aria-selected="true"] { background: var(--indigo); border-color: var(--indigo); color: var(--surface); }
.tab[aria-selected="true"] small { color: inherit; opacity: .9; }
.tab.today { box-shadow: inset 0 -3px 0 var(--shu); }
.tab.extra { align-self: stretch; display: flex; align-items: center; justify-content: center; gap: 4px; }
.tabsep { display: none; }
main { min-width: 0; }
main .pad { padding: 20px max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px)); }
section[role="tabpanel"] { display: grid; gap: 22px; }

@media (min-width: 1000px) {
  body { font-size: 17px; }
  .top .wrap { padding-block: 20px 16px; }
  .top h1 { font-size: 1.9rem; }
  .layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 28px; padding: 0 24px; }
  .tabs { top: 0; align-self: start; position: sticky; background: transparent; border: 0; max-height: 100vh; overflow-y: auto; padding: 20px 0 32px; }
  .tablist { flex-direction: column; overflow: visible; padding: 0; gap: 4px; }
  .tab { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); align-items: baseline; text-align: left; gap: 0 8px; padding: 9px 12px; border-color: transparent; background: transparent; border-radius: 10px; }
  .tab:hover { background: var(--surface); border-color: var(--line); }
  .tab small { font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .ashort { display: none; } .tab .along { display: inline; }
  .tab.today { box-shadow: inset 3px 0 0 var(--shu); }
  .tab.extra { display: flex; justify-content: flex-start; font-size: .95rem; }
  .tabsep { display: block; height: 1px; background: var(--line); margin: 10px 4px; }
  main .pad { padding: 28px 0 96px; }
  section[role="tabpanel"] { gap: 28px; }
}

/* day head */
.dayhead { display: grid; gap: 6px; }
.dayhead h2 { font-family: var(--display); font-size: 1.85rem; line-height: 1.3; margin: 0; text-wrap: balance; letter-spacing: .04em; }
.eyebrow { font-size: .8rem; color: var(--shu); letter-spacing: .12em; font-weight: 700; }
.route { margin: 0; color: var(--ink); font-size: 1.02rem; }
.facts { display: grid; gap: 10px; margin-top: 8px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; font-size: .93rem; }
.fact .k { font-size: .76rem; font-weight: 700; letter-spacing: .1em; color: var(--muted); display: block; }
.fact.elder { background: var(--shu-soft); border-color: transparent; }
.fact.elder .k { color: var(--shu); }
@media (min-width: 760px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dayhead h2 { font-size: 2.2rem; } }

/* timeline */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.slot { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 0 12px; }
.rail { position: relative; display: flex; justify-content: center; }
.rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
.slot:first-child .rail::before { top: 14px; }
.slot:last-child .rail::before { bottom: auto; height: 24px; }
.dot { position: relative; margin-top: 6px; width: 42px; height: 42px; border-radius: 50%; background: var(--surface); border: 2px solid var(--indigo); color: var(--indigo); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.slot.meal .dot { border-color: var(--shu); color: var(--shu); }
.body { padding-bottom: 28px; min-width: 0; display: grid; gap: 12px; }
.body h3 { margin: 14px 0 0; font-size: .82rem; letter-spacing: .14em; color: var(--muted); }
.txt { margin: 0; font-size: 1.02rem; }
.txt.empty { color: var(--muted); }
.row { display: flex; gap: 14px; align-items: flex-start; }
.row .txt { flex: 1; min-width: 0; }
.thumb { flex: 0 0 88px; width: 88px; height: 88px; border-radius: 12px; object-fit: cover; background: var(--line); }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); align-items: start; }
.extlink { font-size: .86rem; }
@media (min-width: 1000px) { .slot { grid-template-columns: 56px minmax(0, 1fr); gap: 0 18px; } .dot { width: 50px; height: 50px; font-size: .88rem; } .thumb { flex-basis: 120px; width: 120px; height: 90px; } }

/* place card */
.place { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.place figure { margin: 0; position: relative; }
.place figure img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--line); }
.place figcaption { position: absolute; right: 6px; bottom: 6px; font-size: .62rem; background: rgba(0,0,0,.55); color: #fff; padding: 1px 6px; border-radius: 4px; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place figcaption a { color: #fff; text-decoration: none; }
.place .in { padding: 12px 16px 16px; display: grid; gap: 8px; }
.place h4 { font-family: var(--display); font-size: 1.25rem; margin: 0; line-height: 1.35; }
.place p { margin: 0; font-size: .96rem; }
.didyou { background: var(--indigo-soft); border-radius: 10px; padding: 8px 12px; font-size: .9rem; }
.didyou b { color: var(--indigo); }
details > summary { cursor: pointer; color: var(--indigo); font-size: .92rem; font-weight: 500; list-style: none; padding: 4px 0; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "＋ "; }
details[open] > summary::before { content: "－ "; }
.more { display: grid; gap: 8px; margin-top: 8px; font-size: .92rem; }
.more dt { font-weight: 700; font-size: .78rem; letter-spacing: .1em; color: var(--muted); }
.more dd { margin: 0; }
.refs { margin: 0; padding-left: 1.1em; font-size: .88rem; }
.refs li { overflow-wrap: anywhere; }

/* nav entries */
.navbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 16px; }
.navlist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 12px; }
.navlist li { border-top: 1px solid var(--line); padding-top: 10px; font-size: .9rem; display: grid; gap: 2px; min-width: 0; }
@media (min-width: 1000px) { .navlist { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; } }
.navlist .nm { font-weight: 700; }
.badge { display: inline-block; font-size: .7rem; padding: 0 7px; border-radius: 99px; background: var(--indigo-soft); color: var(--indigo); margin-right: 6px; font-weight: 500; vertical-align: 1px; }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-decoration: none; border-radius: 99px; padding: 6px 14px; font: inherit; font-size: .86rem; cursor: pointer; min-height: 36px; }
.btn.primary { background: var(--indigo); color: var(--surface); border-color: var(--indigo); }

/* hotel */
.hotels { display: grid; gap: 14px; }
.hotel { border: 2px solid var(--indigo); }
.hotel .in { gap: 10px; }
@media (min-width: 1000px) {
  .hotel.hasfig { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
  .hotel.hasfig figure img { height: 100%; aspect-ratio: auto; min-height: 260px; }
}
.kv { display: grid; grid-template-columns: 5.2em minmax(0,1fr); gap: 6px 10px; font-size: .92rem; margin: 0; }
.kv dt { color: var(--muted); font-weight: 500; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.endnote { text-align: center; color: var(--muted); font-size: .95rem; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }

.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile .k { font-size: .8rem; color: var(--muted); letter-spacing: .08em; }
.tile .v { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile.main { background: var(--indigo); border-color: var(--indigo); color: var(--surface); }
.tile.main .k { color: inherit; opacity: .85; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-size: .78rem; letter-spacing: .08em; color: var(--muted); background: var(--bg); white-space: nowrap; position: sticky; top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.group td { background: var(--indigo-soft); color: var(--indigo); font-weight: 700; }
tr.total td { font-weight: 700; }
td .desc { color: var(--muted); font-size: .8rem; display: block; min-width: 14em; }
.pill { display: inline-block; font-size: .74rem; padding: 1px 9px; border-radius: 99px; white-space: nowrap; }
.pill.done { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.todo { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
h2.sec { font-family: var(--display); font-size: 1.7rem; margin: 0; }

/* packing */
.packgrid { display: grid; gap: 14px; }
@media (min-width: 1000px) { .packgrid { display: block; columns: 2; column-gap: 16px; } .packgrid .pack { break-inside: avoid; margin-bottom: 16px; } }
.pack { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
.pack h3 { margin: 0 0 2px; font-family: var(--display); font-size: 1.15rem; }
.pack .who { margin: 0 0 8px; color: var(--muted); font-size: .86rem; }
.pack ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.pack label { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 8px; padding: 7px 0; cursor: pointer; border-top: 1px solid var(--line); }
.pack li:first-child label { border-top: 0; }
.pack input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--indigo); }
.pack .why { display: block; color: var(--muted); font-size: .83rem; }
.pack input:checked + span { opacity: .5; text-decoration: line-through; }
.progress { font-size: .92rem; color: var(--muted); margin: 0; }

@media (prefers-reduced-motion: no-preference) { section[role="tabpanel"] { animation: fade .25s ease-out; } }
@keyframes fade { from { opacity: .6; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>

 "known": "新航廈外觀以熊本城的黑漆與白灰泥為設計靈感，天花板使用小國杉木。", "todo": "出關後即可在附近租車前往阿蘇；航廈內美食街與伴手禮區（熊本熊商品、辛子蓮根、馬肉料理）值得一逛。", "fact": "航廈入口融入了石垣意象與加藤清正的家紋「蛇之目」，連東京奧運選手村使用過的熊本縣產木材也被再利用。", "refs": [{"title": "阿蘇くまもと空港 官方網站", "url": "https://www.kumamoto-airport.co.jp/"}, {"title": "阿蘇くまもと空港 - Wikipedia", "url": "https://ja.wikipedia.org/wiki/阿蘇くまもと空港"}, {"title": "新ターミナル開業（トラベル Watch）", "url": "https://travel.watch.impress.co.jp/docs/news/1487232.html"}], "img_file": "kmj.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:阿蘇くまもと空港_新ターミナル_20230301_022747462.jpg", "img_credit": "Solasan / CC BY-SA 4.0 (Wikimedia Commons)", "img_note": "2023 年新航廈外觀。"}, "hotel_kukonosato": {"id": "hotel_kukonosato", "name": "空港の郷（包棟民宿）", "desc": "位於西原村布田的平房包棟住宿，距熊本機場約 6 分鐘車程，最多可住 8 人。", "known": "整棟包租、附免費停車、廚房與 Wi-Fi，附近有超市、便利商店與餐廳。", "todo": "適合抵達首晚入住：在機場租車後直接入住，隔天經俵山隧道進阿蘇或往熊本市區都方便。一月夜間氣溫常低於 0°C，注意保暖與路面結冰。", "fact": "西原村是 2016 年熊本地震震度 7 的重災區之一，如今已大致恢復，從村內高地可望見阿蘇外輪山與風力發電機群。", "refs": [{"title": "楽天トラベル「空港の郷」", "url": "https://hotel.travel.rakuten.co.jp/hotelinfo/plan/194531"}, {"title": "西原村 - Wikipedia", "url": "https://ja.wikipedia.org/wiki/西原村"}], "img_file": "hotel_kukonosato.jpg", "img_source": "https://hotel.travel.rakuten.co.jp/hotelinfo/plan/194531", "img_credit": "楽天トラベル（Vacation STAY）房源照片 / 版權屬房東", "img_note": "楽天トラベル房源客廳照片；Booking.com 頁面無法直接取得圖片。"}, "asobridge": {"id": "asobridge", "name": "新阿蘇大橋・展望所「ヨ・ミュール」", "desc": "2021 年 3 月開通的新阿蘇大橋全長 525 公尺，橫跨黑川峽谷，連接南阿蘇村與大津方向，是熊本地震復興的象徵。", "known": "橋旁的展望所「ヨ・ミュール」可同時眺望新橋與當年地震崩塌的山坡。", "todo": "停在展望所欣賞紅色拱形鋼橋與阿蘇群山，並看看震災說明看板；休憩所為臨時住宅「大家之家」移築而來。冬季早晨風大寒冷，記得帶外套。", "fact": "舊阿蘇大橋在 2016 年地震中被山崩整座沖落，新橋改建於舊址下游約 600 公尺處；「ヨ・ミュール」是熊本方言「看得很清楚」的意思。", "refs": [{"title": "新阿蘇大橋展望所（熊本県）", "url": "https://www.pref.kumamoto.jp/soshiki/101/84193.html"}, {"title": "新阿蘇大橋 - Wikipedia", "url": "https://ja.wikipedia.org/wiki/新阿蘇大橋"}, {"title": "新阿蘇大橋が開通（熊日）", "url": "https://kumanichi.com/news/id137157"}], "img_file": "asobridge.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Shin-Aso-ohashi_Bridge_1.jpg", "img_credit": "Takayukidon / CC BY-SA 4.0 (Wikimedia Commons)", "img_note": ""}, "kusasenri": {"id": "kusasenri", "name": "草千里ヶ浜", "desc": "位於阿蘇山中央火口丘烏帽子岳北麓、海拔約 1,100 公尺的大草原，由直徑約 1 公里的火口遺跡形成。", "known": "以遼闊草原、池塘與遠方冒煙的中岳火口構成的經典阿蘇風景聞名。", "todo": "在展望台拍草原與中岳全景，順遊阿蘇火山博物館。一月常見積雪、池面結冰的銀白景色；騎馬體驗 12–2 月休業，山路可能需雪胎或封閉，出發前查路況。", "fact": "草千里其實是約 3 萬年前形成的「二重火口」——西側池塘是外火口底、東側池塘是內火口遺跡。", "refs": [{"title": "草千里ヶ浜 - Wikipedia", "url": "https://ja.wikipedia.org/wiki/草千里ヶ浜"}, {"title": "草千里ヶ浜（るるぶ&more）", "url": "https://rurubu.jp/andmore/spot/80040112"}, {"title": "草千里ヶ浜（ニッポン旅マガジン）", "url": "https://tabi-mag.jp/ku0073/"}], "img_file": "kusasenri.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Kusasenri_Winter.JPG", "img_credit": "Hide1228 / CC BY-SA 3.0 (Wikimedia Commons)", "img_note": "冬季雪景照片。"}, "laluce": {"id": "laluce", "name": "La Luce（阿蘇神社門前町 義大利餐廳）", "desc": "位於阿蘇神社旁門前町商店街的小型義大利餐廳，只有吧台座位，氣氛溫馨。", "known": "門前町少見的義式料理，海膽奶油義大利麵、培根蛋麵、魩仔魚香蒜辣椒麵頗受好評。", "todo": "參拜阿蘇神社後沿「水基巡禮之道」散步，品嚐湧泉、炸可樂餅等小吃，再來這裡吃午餐。座位少，建議避開尖峰；週四公休（以店家最新公告為準）。", "fact": "門前町沿街有多處「水基」湧泉，汲自阿蘇的地下伏流水，可直接飲用，是商店街最大特色。", "refs": [{"title": "ラルーチェ（Retty）", "url": "https://retty.me/restaurant/100001265949/"}, {"title": "阿蘇神社 官方網站", "url": "https://www.asojinja.or.jp/"}], "img_file": "laluce.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Aso_Miyaji_Monzen-cho.JPG", "img_credit": "ja:User:Sanjo / CC BY-SA 3.0 (Wikimedia Commons)", "img_note": "找不到餐廳本身可用照片，改用阿蘇神社門前町商店街街景（2011 年攝）。"}, "daikanbo": {"id": "daikanbo", "name": "大観峰", "desc": "阿蘇北外輪山的最高點展望所，海拔約 936 公尺，可 360 度俯瞰阿蘇破火山口與阿蘇五岳。", "known": "以「涅槃像」般的阿蘇五岳全景與秋冬清晨的雲海聞名。", "todo": "清晨前往最有機會看到雲海；從停車場步行數分鐘到山頂展望台。一月寒風強、氣溫常在冰點以下，路面可能結冰，請穿厚外套並小心駕駛。", "fact": "原名「遠見ヶ鼻」，1922 年由熊本出身的文豪德富蘇峰改名為「大観峰」。", "refs": [{"title": "大観峰 - Wikipedia", "url": "https://ja.wikipedia.org/wiki/大観峰"}, {"title": "大観峰（るるぶ&more）", "url": "https://rurubu.jp/andmore/spot/80040111"}, {"title": "大観峰（GLTJP）", "url": "https://www.gltjp.com/ja/directory/item/12805/"}], "img_file": "daikanbo.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:A_view_of_the_five_mountains_of_Aso_from_Daikanbo_viewpoint.jpg", "img_credit": "STA3816 / CC BY-SA 3.0 (Wikimedia Commons)", "img_note": "從大観峰望阿蘇五岳。"}, "uchinomaki": {"id": "uchinomaki", "name": "阿蘇內牧溫泉（ホテル角萬 日歸入浴）", "desc": "阿蘇破火山口內規模最大的溫泉街，旅館與共同浴場林立；ホテル角萬提供不住宿泡湯。", "known": "內牧溫泉以湯量豐沛、價格親民聞名；角萬以洞窟風大浴場與 6 間免預約的包租湯著稱。", "todo": "角萬日歸入浴 15:00–21:00，大人 500 日圓；包租湯 60 分鐘 2,500 日圓，適合全家一起泡。冬天看完大観峰後來泡湯最暖身（毛巾需自備，最新資訊請先電洽）。", "fact": "角萬為源泉放流的硫酸鹽泉；內牧溫泉也是夏目漱石曾造訪、寫進小說《二百十日》的溫泉地。", "refs": [{"title": "ホテル角萬（るるぶ&more）", "url": "https://rurubu.jp/andmore/spot/80040130"}, {"title": "内牧温泉 - Wikipedia", "url": "https://ja.wikipedia.org/wiki/内牧温泉"}], "img_file": "uchinomaki.jpg", "img_source": "https://rurubu.jp/andmore/spot/80040130", "img_credit": "るるぶ&more（JTBパブリッシング）掲載照片 / 版權所有", "img_note": "ホテル角萬大浴場露天風呂（640×480）；Commons 上的內牧溫泉照片霧氣太重未採用。"}, "asojinja": {"id": "asojinja", "name": "阿蘇神社", "desc": "肥後國一之宮，全國約 450 座阿蘇神社的總本社，供奉開拓阿蘇的健磐龍命等神祇。", "known": "以日本三大樓門之一、高約 18 公尺的「樓門」與罕見的「橫參道」聞名。", "todo": "參拜後在門前町逛「水基」湧泉與小吃；一月新年期間參拜人潮多，樓門掛有巨大注連繩，可求開運御守。", "fact": "2016 年熊本地震中樓門與拜殿全倒，約 1 萬 1 千件構件經檢查後再利用約 7 成，並加入鋼骨補強，2023 年 12 月修復竣工。", "refs": [{"title": "阿蘇神社 官方網站", "url": "https://www.asojinja.or.jp/"}, {"title": "阿蘇神社 - Wikipedia", "url": "https://ja.wikipedia.org/wiki/阿蘇神社"}, {"title": "阿蘇神社の主要社殿が復旧完了（熊日）", "url": "https://www.kumanichi.com/articles/1256221"}], "img_file": "asojinja.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Aso_Jinja_Romon_20251005-1.jpg", "img_credit": "Totti / CC BY-SA 4.0 (Wikimedia Commons)", "img_note": "修復後的樓門（2025 年 10 月攝）。"}, "hotel_asolavista": {"id": "hotel_asolavista", "name": "Aso La Vista 阿蘇の家", "desc": "位於阿蘇市的整棟出租住宿，空間寬敞乾淨、附廚房與停車位，適合開車自駕的家庭。", "known": "住客好評空間大、居家氛圍與設備齊全的廚房。", "todo": "以此為據點，阿蘇神社、內牧溫泉、大観峰都在短車程內。一月夜裡非常冷，晚上可在屋內煮火鍋；注意 Booking 提醒樓梯窄陡，長輩上下要小心。", "fact": "從阿蘇市區即可望見阿蘇五岳與外輪山，是世界最大級的破火山口之一，火口內住著約 5 萬人。", "refs": [{"title": "Booking.com: Aso La Vista 阿蘇の家", "url": "https://www.booking.com/hotel/jp/aso-la-vista-a-su-nojia-a-su-shi.html"}, {"title": "Aso La Vista 阿蘇の家 住客評價（hotelping）", "url": "https://hotelping.net/en/hotels/aso-la-vista-%E9%98%BF%E8%98%87%E3%81%AE%E5%AE%B6"}, {"title": "楽天トラベル「阿蘇vista」", "url": "https://hotel.travel.rakuten.co.jp/hotelinfo/plan/199814"}], "img_file": "hotel_asolavista.jpg", "img_source": "https://hotel.travel.rakuten.co.jp/hotelinfo/plan/199814", "img_credit": "楽天トラベル（Vacation STAY）房源照片 / 版權屬房東", "img_note": "Booking.com 頁面無法自動取得圖片；改用楽天「阿蘇vista」（一の宮町宮地）房源照片，名稱相近但房型描述與 Booking 不完全一致，可能非同一單位，請以 Booking 頁面照片確認。"}, "olmo": {"id": "olmo", "name": "Olmo Coppia（オルモ コッピア）", "desc": "阿蘇市蔵原的古民家咖啡館，由屋齡逾 160 年的倉庫改建，遠離國道、環境寧靜。", "known": "以阿蘇在地無農藥蔬菜做的健康料理聞名，招牌是蔬菜滿滿的「畑の野菜ワンプレート」。", "todo": "推薦午餐吃蔬菜拼盤，飯後來份起司蛋糕；午餐 11:30–14:30，週一、二公休，可能臨時休，出發前先電話確認（0967-34-1710）。", "fact": "蔬菜由附近農家「隨季配送」，所以每次拼盤內容都依當季阿蘇蔬菜而變。", "refs": [{"title": "olmo coppia（るるぶ&more）", "url": "https://rurubu.jp/andmore/spot/80040155"}, {"title": "阿蘇市蔵原 olmo coppia（熊日）", "url": "https://kumanichi.com/articles/655074"}], "img_file": "olmo.jpg", "img_source": "https://rurubu.jp/andmore/spot/80040155", "img_credit": "るるぶ&more（JTBパブリッシング）掲載照片 / 版權所有", "img_note": "店舖外觀（640×480）。"}, "kumamotojo": {"id": "kumamotojo", "name": "熊本城", "desc": "1607 年由加藤清正築成，日本三大名城之一，以壯觀的石垣與黑色天守聞名。", "known": "以向上反翹、敵人難以攀爬的「武者返」石垣，以及 2016 年震災後的修復歷程著稱。", "todo": "走「特別見學通路」看修復中的石垣，登上天守閣展望熊本市區；冬季遊客較少、天空清澈。2026 年 7 月地震造成部分石垣再度受損，出發前請查官網開放範圍。", "fact": "天守閣於 2021 年 3 月完成震災修復，但整座城預計到 2052 年度才全面修復完成。", "refs": [{"title": "熊本城 官方網站", "url": "https://castle.kumamoto-guide.jp/"}, {"title": "熊本城 - Wikipedia", "url": "https://ja.wikipedia.org/wiki/熊本城"}, {"title": "熊本城 公開再開（熊日 2026/8）", "url": "https://kumanichi.com/articles/2024755"}], "img_file": "kumamotojo.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Kumamoto_Castle_Keep_Tower_20221022-1.jpg", "img_credit": "Suicasmo / CC BY-SA 4.0 (Wikimedia Commons)", "img_note": "修復後的天守閣（2022 年攝）。"}, "johsaien": {"id": "johsaien", "name": "桜の馬場 城彩苑", "desc": "熊本城下的觀光設施，重現城下町街景，由美食伴手禮街「桜の小路」與歷史文化體驗館「湧々座」組成。", "known": "以熊本美食小吃（馬肉、辛子蓮根、いきなり団子）與熊本城歷史互動展示聞名。", "todo": "逛桜の小路邊走邊吃，到湧々座看熊本城歷史；也是熊本城周遊巴士的起點，冬天可來碗熱呼呼的太平燕或甜酒。", "fact": "「桜の馬場」之名來自江戶時代這裡曾是熊本藩的馬術練習場。", "refs": [{"title": "桜の馬場 城彩苑 官方網站", "url": "https://www.sakuranobaba-johsaien.jp/"}, {"title": "桜の馬場 城彩苑 - Wikipedia", "url": "https://ja.wikipedia.org/wiki/桜の馬場_城彩苑"}], "img_file": "johsaien.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Sakuranobaba-Josaien_Museum_near_Kumamoto_Castle.JPG", "img_credit": "そらみみ / CC BY-SA 4.0 (Wikimedia Commons)", "img_note": ""}, "aoyagi": {"id": "aoyagi", "name": "熊本郷土料理 青柳", "desc": "1949 年創業、位於下通的老字號和食店，使用有明海、天草與阿蘇食材，一次吃遍熊本鄉土料理。", "known": "以馬刺（據說源自青柳）、辛子蓮根、一文字ぐるぐる，以及 75 年以上的招牌釜飯聞名。", "todo": "點馬刺拼盤與馬肉壽喜燒，最後以釜飯收尾；有掘炬燵包廂適合家庭。高蛋白的馬刺低脂，適合控醣；建議先訂位（096-353-0311）。", "fact": "預約制的「本丸御膳」重現了江戶時代肥後細川藩的宴席菜單。", "refs": [{"title": "熊本郷土料理 青柳（GLTJP）", "url": "https://www.gltjp.com/zh-hant/directory/item/19023/"}, {"title": "郷土料理 青柳（るるぶ&more）", "url": "https://rurubu.jp/andmore/spot/80039857"}, {"title": "青柳（Retty）", "url": "https://retty.me/restaurant/100000159478/"}], "img_file": "aoyagi.webp", "img_source": "https://www.gltjp.com/zh-hant/directory/item/19023/", "img_credit": "GLTJP（Good Luck Trip）店家提供照片 / 版權所有", "img_note": "料理照片（本丸御膳），非店面外觀。"}, "shotengai": {"id": "shotengai", "name": "上通・下通商店街", "desc": "熊本市中心最熱鬧的兩條拱廊商店街，以通町筋為界，北為上通、南為下通，下雨也能逛。", "known": "下通店家密集、百貨與美食多；上通較有文青氣息，延伸至並木坂的咖啡與小店。", "todo": "晚餐後散步逛藥妝、熊本熊周邊與在地甜點；上乃裏通巷弄裡也有不少小店。一月冬季特賣期間折扣多。", "fact": "上通是日本第一個大範圍導入 Edy 電子錢包的商店街。", "refs": [{"title": "上通 - Wikipedia", "url": "https://ja.wikipedia.org/wiki/上通"}, {"title": "熊本城 官方網站（周邊觀光）", "url": "https://castle.kumamoto-guide.jp/"}], "img_file": "shotengai.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Shimotori_ac_(1).jpg", "img_credit": "Asturio Cantabrio / CC BY-SA 4.0 (Wikimedia Commons)", "img_note": "下通拱廊（2023 年攝）。"}, "hotel_villa": {"id": "hotel_villa", "name": "Sakuramachi Villa（投影機・BBQ・免費停車）", "desc": "熊本市中央區練兵町的整棟住宿，兩房一廳、最多 10 人，附投影機、陽台 BBQ 烤爐與 1 個免費車位。", "known": "Airbnb 評分約 4.98，以和室投影空間與市中心便利位置受好評。", "todo": "步行約 17 分鐘到熊本城，也近下通、SAKURA MACHI 購物中心；晚上全家在和室用投影機看電影。一月晚上冷，BBQ 請斟酌天候。", "fact": "距離「SAKURA MACHI Kumamoto」（熊本最大的巴士總站複合商場，屋頂庭園有巨大熊本熊）步行可達。", "refs": [{"title": "Booking.com: Sakuramachi Villa", "url": "https://www.booking.com/hotel/jp/sakuramachi-villa-projector-bbq-free-parking.html"}, {"title": "Airbnb: Sakuramachi Villa", "url": "https://www.airbnb.com/rooms/1417434700467571621"}], "img_file": "hotel_villa.jpg", "img_source": "https://www.airbnb.com/rooms/1417434700467571621", "img_credit": "Airbnb 房源照片 / 版權屬房東", "img_note": "Booking.com 頁面無法自動取得圖片，改用同一物件的 Airbnb 照片（和室投影空間）。"}, "yulax": {"id": "yulax", "name": "湯らっくす（Yulax 三溫暖・溫泉）", "desc": "熊本市中央區本莊的 24 小時溫泉三溫暖設施，被三溫暖迷稱為「西之聖地」。", "known": "以據稱日本最深級、使用阿蘇伏流水的冷水池，以及按下即從頭頂灌水的「MADMAX 按鈕」聞名。", "todo": "體驗三種風格的三溫暖與每天多場的 Aufguss（熱風服務），再跳進可飲用的天然冷水池；長輩可只泡溫泉。8:00–10:00 清潔不可入浴。", "fact": "冷水池深約 171 公分（使用者紀錄），要按 MADMAX 按鈕得站在深池中拉繩，水像瀑布一樣打在頭上。", "refs": [{"title": "湯らっくす 官方網站", "url": "https://www.yulax.info/"}, {"title": "湯らっくす（さんたつ）", "url": "https://san-tatsu.jp/spots/348436/"}, {"title": "西の聖地 湯らっくす（文春オンライン）", "url": "https://bunshun.jp/articles/-/42172"}], "img_file": "yulax.jpg", "img_source": "https://www.yulax.info/", "img_credit": "湯らっくす 官方網站照片 / 版權所有", "img_note": "三溫暖室內照片（官網圖庫）。"}, "shirakawa": {"id": "shirakawa", "name": "白川水源", "desc": "位於南阿蘇村白川吉見神社境內的湧泉，是熊本市白川的源頭，池底細砂隨泉水翻湧，清澈見底。", "known": "入選日本環境省「名水百選」，是阿蘇最具代表性的湧泉。", "todo": "沿木棧道看泉水從池底湧出，用自備瓶子免費裝泉水；1月氣溫低但水溫恆溫，冷天常見水面冒出淡淡水氣。需付環境保全協力金（約100日圓）。", "fact": "每分鐘湧出約60噸泉水，水溫全年維持約14°C。", "refs": [{"title": "白川水源 – Wikipedia（日文）", "url": "https://ja.wikipedia.org/wiki/%E7%99%BD%E5%B7%9D%E6%B0%B4%E6%BA%90"}, {"title": "みなみあそ info（南阿蘇綜合情報網）", "url": "https://www.minamiaso.info/"}, {"title": "白川水源 – tabi-mag.jp", "url": "https://tabi-mag.jp/ku0050/"}], "img_file": "img_raw/shirakawa.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Shirakawa_Spring_2023.jpg", "img_credit": "ブルーノ・プラス / CC BY 4.0（Wikimedia Commons）", "img_note": ""}, "tanohana": {"id": "tanohana", "name": "野菜料理 田の花", "desc": "高千穗町三田井的家庭式和食小店，以當地自種蔬菜與米做成多格蔬菜拼盤，宮崎縣認定的「地產地消講究料理店」。", "known": "九宮格般的蔬菜料理一盤（約1,650日圓），也可加點高千穗牛（約3,465日圓起）。", "todo": "午餐時段（11:30–15:00，不定休）前往品嚐蔬菜拼盤；蔬菜套餐需預約，建議出發前電話確認（0982-76-1087）。冬季菜色以根莖類與醃漬菜為主。", "fact": "2022年起每天只接待一組客人留宿，可說是「能住的蔬菜餐廳」。", "refs": [{"title": "野菜料理 田の花 – るるぶ&more", "url": "https://rurubu.jp/andmore/spot/80041559"}, {"title": "野菜料理 田の花 – Retty", "url": "https://retty.me/restaurant/100000033839/"}], "img_file": "img_raw/tanohana.jpg", "img_source": "https://rurubu.jp/andmore/spot/80041559", "img_credit": "© JTB（るるぶ&more 刊載照片，圖檔 j-jti.com）", "img_note": "店家的蔬菜拼盤照片（640×480），非建築外觀。"}, "takachihokyo": {"id": "takachihokyo", "name": "高千穗峽", "desc": "五瀨川切穿阿蘇火山碎屑流熔岩形成的V字峽谷，柱狀節理斷崖平均高約80公尺，是國家指定名勝暨天然紀念物。", "known": "划手划船穿過峽谷、在船上仰望「真名井瀑布」，是宮崎最經典的畫面。", "todo": "租手划船（30分鐘，約4,100日圓起，可網路預約）近看真名井瀑布，再走約1公里的峽谷步道到高千穗神社。1月水量較少、遊客少，但河谷陰冷，注意保暖與防滑。", "fact": "真名井瀑布落差17公尺，入選「日本瀑布百選」，傳說是天村雲命從天上移來的水源。", "refs": [{"title": "高千穂峡 – Wikipedia（日文）", "url": "https://ja.wikipedia.org/wiki/%E9%AB%98%E5%8D%83%E7%A9%82%E5%B3%A1"}, {"title": "高千穂町観光協会", "url": "https://takachiho-kanko.info/"}, {"title": "高千穂峡 – tabi-mag.jp", "url": "https://tabi-mag.jp/mz0025/"}], "img_file": "img_raw/takachihokyo.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Takachiho_Gorge_by_boat.jpg", "img_credit": "Max Smith / Public domain（Wikimedia Commons）", "img_note": ""}, "amanoyasu": {"id": "amanoyasu", "name": "天安河原 / 天岩戶神社", "desc": "天岩戶神社分東、西本宮，西本宮供奉神話中天照大神藏身的「天岩戶」；沿岩戶川步行約10分鐘即到天安河原洞窟。", "known": "日本神話「天岩戶」舞台；天安河原洞窟內堆滿無數祈願小石塔，氣氛神祕。", "todo": "先到西本宮授與所申請神職導覽（約8:30–16:30，免費／隨喜），到遙拜所參拜天岩戶，再走河畔步道到天安河原堆石許願。冬天步道濕滑，穿防滑鞋。", "fact": "傳說眾神曾聚集在天安河原的大洞窟「仰慕窟」商量如何把天照大神請出岩戶；天岩戶本身禁止拍照。", "refs": [{"title": "天岩戸神社 官方網站", "url": "https://amanoiwato-jinja.jp/"}, {"title": "天岩戸神社 – Wikipedia（日文）", "url": "https://ja.wikipedia.org/wiki/%E5%A4%A9%E5%B2%A9%E6%88%B8%E7%A5%9E%E7%A4%BE"}, {"title": "天安河原 – tabi-mag.jp", "url": "https://tabi-mag.jp/mz0067/"}], "img_file": "img_raw/amanoyasu.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:%E5%A4%A9%E5%AE%89%E6%B2%B3%E5%8E%9F_-_panoramio.jpg", "img_credit": "sk01 / CC BY-SA 3.0（Wikimedia Commons，Panoramio）", "img_note": "照片為天安河原洞窟（仰慕窟）；未另附天岩戶神社社殿照片。"}, "yokagura": {"id": "yokagura", "name": "高千穗神社 夜神樂（觀光神樂）", "desc": "高千穗神社神樂殿每晚演出的觀光神樂，從全套33番夜神樂中精選4番代表段落，約1小時。", "known": "演出天岩戶神話：手力雄之舞、鈿女之舞、戶取之舞與御神體之舞，幽默又有趣，小孩也看得懂。", "todo": "每晚20:00–21:00，票價1,000日圓（小學生以下免費）；約150席中80席可網路預約，其餘當天19:00起現場受理。1月正值各聚落奉納夜神樂的季節，氣氛最濃。", "fact": "高千穗夜神樂是國家重要無形民俗文化財，傳統上每年11月至2月在約20個聚落通宵演出33番。", "refs": [{"title": "高千穂の夜神楽 – Wikipedia（日文）", "url": "https://ja.wikipedia.org/wiki/%E9%AB%98%E5%8D%83%E7%A9%82%E3%81%AE%E5%A4%9C%E7%A5%9E%E6%A5%BD"}, {"title": "高千穂神楽（高千穂神社 神楽殿）– Good Luck Trip", "url": "https://www.gltjp.com/ja/directory/item/14676/"}, {"title": "高千穂町観光協会", "url": "https://takachiho-kanko.info/"}], "img_file": "img_raw/yokagura.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Yokagura_Sacred_Dance_(31561847845).jpg", "img_credit": "David Stanley / CC BY 2.0（Wikimedia Commons）", "img_note": "1024×768，攝於高千穗神社神樂殿演出。"}, "hotel_takachiho": {"id": "hotel_takachiho", "name": "高千穗山莊 天照・神樂（Takachiho Sanso Amaterasu Kagura）", "desc": "湯布院B&B經營的整棟出租平房山莊（「あまてらす」5DK、「かぐら」4DK，同址），附廚房、洗衣機與2個停車位，最多可住16–18人。", "known": "整棟包棟、可自炊，適合大家庭；離高千穗巴士總站約7分鐘車程。", "todo": "以此為據點晚上去看夜神樂、清晨去國見之丘看雲海（秋冬早晨較易出現）；附近有FamilyMart與Joyful家庭餐廳可補給。", "fact": "「かぐら」棟2024年10月才開幕，「あまてらす」棟2025年5月剛翻新廚房，屬於很新的包棟住宿。", "refs": [{"title": "高千穂山荘 あまてらす – 湯布院B&B", "url": "https://yufuin-bnb.com/lodging/id_2016/"}, {"title": "高千穂山荘 かぐら – 湯布院B&B", "url": "https://yufuin-bnb.com/lodging/id_2017/"}, {"title": "Booking.com 訂房頁", "url": "https://www.booking.com/hotel/jp/takachiho-sanso-amaterasu-kagetsu.html"}], "img_file": "img_raw/hotel_takachiho.jpg", "img_source": "https://yufuin-bnb.com/lodging/id_2016/", "img_credit": "© 湯布院B&B（株式會社リョウ・コーポレーション）官方照片", "img_note": "Booking.com 頁面無法抓取（防爬蟲），改用營運商官網的山莊外觀夜景照（あまてらす棟），已縮至1600px。"}, "kurokawa": {"id": "kurokawa", "name": "黑川溫泉", "desc": "南小國町山谷中約30間旅館組成的溫泉鄉，全區以「黑川一旅館」理念統一木造景觀，被譽為九州最有味道的溫泉街。", "known": "「入湯手形」露天風呂巡禮：一塊木牌可任選3處旅館露天風呂泡湯。", "todo": "到旅館組合「風の舎」買入湯手形（大人1,500日圓，入浴8:30–21:00，6個月內有效），也可把其中1格換成餐飲或伴手禮。冬季「湯あかり」竹燈籠點燈（往年約12月下旬至3月底）夜晚最浪漫。", "fact": "入湯手形誕生於1986年，原本是為了幫沒空間蓋露天風呂的2間旅館，結果讓黑川溫泉一舉全國爆紅。", "refs": [{"title": "黒川温泉 官方網站 – 入湯手形", "url": "https://www.kurokawaonsen.or.jp/tegata/"}, {"title": "黒川温泉 – Wikipedia（日文）", "url": "https://ja.wikipedia.org/wiki/%E9%BB%92%E5%B7%9D%E6%B8%A9%E6%B3%89"}], "img_file": "img_raw/kurokawa.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Street_in_Kurokawa_Onsen.jpg", "img_credit": "Tzu-hsun, Hsu / CC BY-SA 4.0（Wikimedia Commons）", "img_note": ""}, "hotel_forest": {"id": "hotel_forest", "name": "黑川 Forest Village（森のコテージ）", "desc": "位於黑川溫泉上方高台的9棟小木屋與古民家，開車到溫泉街約4–7分鐘，不供餐、可自炊或烤肉。", "known": "森林環繞的原木小屋與包場露天岩風呂，適合大家族一起住。", "todo": "預約森林中的包場露天風呂（1小時1,500日圓），晚上在露台看星空；白天下山買入湯手形泡黑川溫泉。1月高台可能結冰積雪，建議備雪胎並白天抵達。", "fact": "最大的木屋可住12人，另有附五右衛門風呂的古民家，能體驗傳統鐵鍋浴缸。", "refs": [{"title": "黑川 Forest Village 官方網站（繁中）", "url": "https://www.morikote.com/zh-tw"}], "img_file": "img_raw/hotel_forest.jpg", "img_source": "https://www.morikote.com/zh-tw", "img_credit": "© 黒川 Forest Village（森のコテージ）官方網站照片", "img_note": "官網首頁輪播圖（小木屋外觀夜景），已縮至1600px。"}, "kujuski": {"id": "kujuski", "name": "九重森林公園滑雪場（くじゅうスキー場）", "desc": "位於大分縣九重町、標高約1,300公尺九重高原的滑雪場，是大分縣唯一的滑雪場，自稱「九州最大級」。", "known": "以造雪機打造的高品質人工雪，8條雪道從初學到進階都有，非常適合家庭與新手。", "todo": "租全套雪具雪衣（官網稱租借品逾萬件，可空手來），小孩可玩兒童雪地樂園；1月與2月週末及假日有夜間滑雪至20:00。從九重IC約30分鐘，山路可能結冰需雪胎。", "fact": "九州唯一的滑雪・單板公認學校就設在這裡，可預約團體課程。", "refs": [{"title": "くじゅうスキー場 官方網站", "url": "https://www.kujyuski.co.jp/"}, {"title": "九重森林公園滑雪場全攻略 – WaTabi", "url": "https://watabi.org/articles/kuju-ski-park-guide"}, {"title": "Kujyu Shinrin Koen Ski Resort – Japan National Parks", "url": "https://www.japan.travel/national-parks/parks/aso-kuju/see-and-do/kujyu-shinrin-koen-ski-resort"}], "img_file": "img_raw/kujuski.jpg", "img_source": "https://www.kujyuski.co.jp/", "img_credit": "© くじゅうスキー場 官方網站主視覺影片截圖", "img_note": "Commons 無此滑雪場照片；取自官網首頁宣傳影片（mainvisual-top.mp4，28秒處）的畫面並做自動對比校正，1440×820，畫質略有壓縮感。"}, "nabegataki": {"id": "nabegataki", "name": "鍋瀑布（鍋ヶ滝）", "desc": "小國町的「裏見瀑布」，高約10公尺、寬約20公尺，像水簾般垂落，可走到瀑布後方的寬闊空間。", "known": "從瀑布背面往外看的水簾景致，曾是松嶋菜々子「生茶」廣告拍攝地。", "todo": "須事先上網預約入園時段（9:00–17:00，最後入園16:30；成人300日圓、中小學生150日圓），年末年始休園。1月可能結冰，步道有階梯，注意防滑。", "fact": "2021年起改採預約制紓解人潮，因此入選「世界永續觀光目的地TOP100（2022）」。", "refs": [{"title": "鍋ヶ滝 – Wikipedia（日文）", "url": "https://ja.wikipedia.org/wiki/%E9%8D%8B%E3%83%B6%E6%BB%9D"}, {"title": "ASOおぐに観光協会（小國町觀光）", "url": "https://ogunitown.info/"}, {"title": "Nabegataki Park – Good Luck Trip", "url": "https://www.gltjp.com/en/directory/item/18026/"}], "img_file": "img_raw/nabegataki.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Kumamoto-Nabegataki_Waterfall-m.jpg", "img_credit": "小国町 / CC BY 4.0（Wikimedia Commons）", "img_note": "照片為夜間點燈時的鍋瀑布。"}, "yunotsubo": {"id": "yunotsubo", "name": "湯の坪街道（由布院）", "desc": "從JR由布院站一路延伸到金鱗湖、長約800公尺的由布院主街，兩旁林立伴手禮店、甜點店與小型美術館。", "known": "邊走邊吃的天堂，還能正面遠眺有「豐後富士」之稱的由布岳。", "todo": "吃金賞可樂餅、現烤銅鑼燒、布丁等小吃，順路散步到金鱗湖；1月早上店家約9–10點才開，建議上午先看湖再逛街。", "fact": "街道正對標高1,583公尺的由布岳，是由布院最經典的拍照角度。", "refs": [{"title": "るるぶ&more 湯の坪街道", "url": "https://rurubu.jp/andmore/spot/80040989"}, {"title": "tabi-mag 湯の坪街道", "url": "https://tabi-mag.jp/ot0825/"}, {"title": "GLTJP 湯の坪街道", "url": "https://www.gltjp.com/zh-hant/directory/item/15516/"}], "img_file": "yunotsubo.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Mount_Yufudake_from_Yunotsubo_Street.JPG", "img_credit": "そらみみ / CC BY-SA 4.0 (Wikimedia Commons)", "img_note": "從湯の坪街道望向由布岳"}, "abutaaru": {"id": "abutaaru", "name": "インドレストラン アブタール（由布院）", "desc": "位於由布院站附近花の木通的道地印度／尼泊爾料理餐廳，兩層樓共約70席。", "known": "香料與米從印度進口、點餐後現做的咖哩與饢餅，素食選擇也多。", "todo": "點咖哩套餐、坦都里烤雞或尼泊爾式定食；全天營業（約11:00–22:30），適合逛完湯の坪後的晚餐。", "fact": "在以和食為主的溫泉小鎮裡，是少數由同一集團在大分縣經營三家分店的南亞料理餐廳。", "refs": [{"title": "Tabelog 印度餐廳 Abutaaru", "url": "https://tabelog.com/en/oita/A4402/A440201/44011172/"}, {"title": "ぐるなび Abutaaru", "url": "https://gurunavi.com/en/f757406/rst/?asp=gn"}], "img_file": "abutaaru.jpg", "img_source": "https://tabelog.com/en/oita/A4402/A440201/44011172/", "img_credit": "Tabelog 店家／食評照片（版權屬原作者）", "img_note": "餐廳料理照片（定食），取自 Tabelog 店頁；非自由授權"}, "kinrinko": {"id": "kinrinko", "name": "金鱗湖", "desc": "位於由布岳山腳、湯の坪街道盡頭的小湖，湖底同時湧出溫泉與清水。", "known": "秋冬清晨湖面升起的夢幻朝霧。", "todo": "1月是看朝霧的最佳季節，建議日出前後約6:30–8:00到湖畔，氣溫越低霧越濃；可順遊湖畔的天祖神社鳥居與老舖咖啡館。", "fact": "1884年儒學者毛利空桑看見夕陽下魚鱗閃著金光而命名，因湧溫泉水溫偏高，冷天才會冒出湯氣。", "refs": [{"title": "tabi-mag 金鱗湖", "url": "https://tabi-mag.jp/ot0346/"}, {"title": "GLTJP 金鱗湖", "url": "https://www.gltjp.com/zh-hant/directory/item/11555/"}, {"title": "なっぷマガジン 金鱗湖", "url": "https://www.nap-camp.com/mag/121609"}], "img_file": "kinrinko.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Lake_Kinrin_with_Morning_fog.jpg", "img_credit": "Tzu-hsun, Hsu / CC BY-SA 4.0 (Wikimedia Commons)", "img_note": "金鱗湖晨霧"}, "hotel_nagomiya": {"id": "hotel_nagomiya", "name": "湯布院 政庵・和家（Yufuin Matsuri-an Nagomiya）", "desc": "位於湯布院町川上、步行可達金鱗湖的獨棟包棟溫泉住宿，附私人露天溫泉與廚房。", "known": "包棟入住、私人源泉掛流露天風呂，適合家族一起住。", "todo": "清晨步行去金鱗湖看朝霧，晚上在自家露天風呂泡湯；入住約15:00–18:00、退房10:00前，需事先告知抵達時間。", "fact": "房客評價最常提到的就是「源泉掛け流し」的私人露天溫泉——在冬夜邊冒熱氣邊泡湯。", "refs": [{"title": "Trip.com 湯布院 和家 Nagomiya", "url": "https://us.trip.com/hotels/yufu-hotel-detail-72981918/nagomiya/"}, {"title": "Dinogo 湯布院 政庵・和家", "url": "https://dinogo.com/hotels/578333-yufuin-matsurian-nagomiya"}], "img_file": "hotel_nagomiya.jpg", "img_source": "https://us.trip.com/hotels/yufu-hotel-detail-72981918/nagomiya/", "img_credit": "Trip.com 房源照片（版權屬業者）", "img_note": "私人露天風呂照片取自 Trip.com「湯布院 和家 YUFUIN NAGOMI-YA」房源（列地址川上1777-2，與1777-1應為同業者相鄰棟）；Booking.com 無法擷取"}, "ropeway": {"id": "ropeway", "name": "別府纜車・鶴見岳", "desc": "從別府高原站（約海拔500m）約10分鐘直上鶴見岳山頂站（約1,300m），可俯瞰別府灣與市區；大人來回約1,800日圓，冬季營業至16:30。", "known": "冬季山頂的霧氷（樹冰）與360度別府灣景觀。", "todo": "霧氷約12月上旬至3月中旬出現，1月寒冷晴朗的早晨最有機會；山頂比市區冷約8°C，請帶厚外套、手套並穿防滑鞋。", "fact": "不用登山就能看到霧氷，鶴見岳被列為「西日本三大霧氷名所」之一。", "refs": [{"title": "GLTJP 別府纜車", "url": "https://www.gltjp.com/ja/directory/item/16148/"}, {"title": "tabi-mag 鶴見岳の霧氷", "url": "https://tabi-mag.jp/mttsurumi-muhyou/"}, {"title": "tabi-mag 西日本三大霧氷", "url": "https://tabi-mag.jp/frost-big3"}], "img_file": "ropeway.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Beppu_Ropeway.JPG", "img_credit": "JKT-c / CC BY 3.0 (Wikimedia Commons)", "img_note": "別府纜車車廂（非冬季霧氷照；Commons 找不到鶴見岳霧氷照片）"}, "jigokumushi": {"id": "jigokumushi", "name": "地獄蒸し工房 鐵輪", "desc": "鐵輪溫泉街上的體驗設施，利用約100°C的溫泉蒸氣自己蒸海鮮、蔬菜、雞蛋來吃。", "known": "別府名物「地獄蒸し」料理的自助體驗。", "todo": "買現成食材組（海鮮組、玉手箱等）或自備食材，蒸釜15分鐘約400日圓；營業10:00–19:00（蒸釜受理至18:00），每月第3個週三休，外面還有免費足湯與足蒸。", "fact": "只用溫泉蒸氣加熱，不加任何燃料，蒸氣裡的礦物質讓食材帶有淡淡鹹味。", "refs": [{"title": "地獄蒸し工房 鉄輪 官網", "url": "https://jigokumushi.com/"}, {"title": "MATCHA 地獄蒸し工房 鉄輪", "url": "https://matcha-jp.com/jp/1896"}, {"title": "るるぶ&more 地獄蒸し工房 鉄輪", "url": "https://rurubu.jp/andmore/spot/80040541"}], "img_file": "jigokumushi.jpg", "img_source": "https://jigokumushi.com/", "img_credit": "地獄蒸し工房 鉄輪 官網（版權屬業者）", "img_note": "取自官網首頁主視覺（已裁去頁首）"}, "jigoku": {"id": "jigoku", "name": "別府地獄めぐり（海地獄・血の池地獄）", "desc": "別府市內7處自然噴發的「地獄」溫泉池，可一票通看；海地獄的鈷藍色熱泉最具代表性。", "known": "湛藍的海地獄與赤紅的血の池地獄，色彩鮮明到不像真的。", "todo": "海地獄必看藍色熱池、溫室大王蓮與溫泉蒸布丁；血の池地獄在約3km外的柴石地區，可開車前往。冬天水氣最濃，蒸氣景觀最壯觀。", "fact": "海地獄約1,200年前因鶴見岳噴發形成，泉溫高達98°C，藍色來自硫酸鐵；與血の池地獄等於2009年列為國家名勝。", "refs": [{"title": "別府地獄めぐり 官網", "url": "https://www.beppu-jigoku.com/"}, {"title": "tabi-mag 海地獄", "url": "https://tabi-mag.jp/ot0067/"}, {"title": "tabi-mag 血の池地獄", "url": "https://tabi-mag.jp/ot0076/"}], "img_file": "jigoku.jpg", "img_source": "https://commons.wikimedia.org/wiki/File:Umi_Jigoku_October_2011_01.jpg", "img_credit": "STA3816 / CC BY-SA 3.0 (Wikimedia   const fig = hasImg(id) ? `<figure><img src="${imgSrc(id)}" alt="${esc(p.name)}" loading="lazy">${p.img_credit || p.img_source ? `<figcaption>${p.img_source ? `<a href="${esc(p.img_source)}" target="_blank" rel="noopener">📷 ${esc(p.img_credit || '圖片來源')}</a>` : esc(p.img_credit)}</figcaption>` : ''}</figure>` : '';
  const refs = (p.refs || []).map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title || r.url)}</a></li>`).join('');
  return `<article class="place">${fig}<div class="in">
    <h4>${esc(p.name)}</h4>
    <p>${esc(p.desc)}</p>
    ${p.fact ? `<div class="didyou"><b>你知道嗎？</b>${esc(p.fact)}</div>` : ''}
    <details><summary>特色・推薦玩法・參考資料</summary><dl class="more">
      ${p.known ? `<div><dt>以什麼聞名</dt><dd>${esc(p.known)}</dd></div>` : ''}
      ${p.todo ? `<div><dt>推薦做什麼</dt><dd>${esc(p.todo)}</dd></div>` : ''}
      ${refs ? `<div><dt>參考連結</dt><dd><ul class="refs">${refs}</ul></dd></div>` : ''}
    </dl></details>
  </div></article>`;
}

function copyBtn(text) { return `<button class="btn" type="button" data-copy="${esc(text)}">複製</button>`; }

function navBox(list) {
  if (!list.length) return '';
  const items = list.map(n => `<li>
    <div><span class="badge">${esc(n.type)}</span><span class="nm">${esc(n.name)}</span></div>
    ${n.addr ? `<div class="muted">${esc(n.addr)}</div>` : ''}
    ${n.tel ? `<div class="mono">導航電話 ${esc(n.tel)}</div>` : ''}
    ${n.note ? `<div class="muted">${esc(n.note)}</div>` : ''}
    <div class="btns"><a class="btn primary" href="${esc(n.map)}" target="_blank" rel="noopener">Google 地圖 ↗</a>${n.tel ? copyBtn(n.tel) : ''}${n.site ? `<a class="btn" href="${esc(n.site)}" target="_blank" rel="noopener">官網 ↗</a>` : ''}</div>
  </li>`).join('');
  return `<details class="navbox"><summary>導航・地址・電話（${list.length}）</summary><ul class="navlist">${items}</ul></details>`;
}

function hotelCard(key, idx) {
  const h = DATA.hotels[key]; if (!h) return '';
  const n = h.nav, b = h.book, p = DATA.places[key] || {};
  const fig = hasImg(key) ? `<figure><img src="${imgSrc(key)}" alt="${esc(n.name)}" loading="lazy">${p.img_source ? `<figcaption><a href="${esc(p.img_source)}" target="_blank" rel="noopener">📷 ${esc(p.img_credit || '圖片來源')}</a></figcaption>` : ''}</figure>` : '';
  return `<article class="place hotel${fig ? ' hasfig' : ''}">${fig}<div class="in">
    <div class="eyebrow">${idx ? '今晚也住這裡（隔壁）' : '今晚住這裡'}${b.nights && b.nights !== '1' ? ` · 連住 ${esc(b.nights)} 晚（${esc(b.dates)}）` : ''}</div>
    <h4>${esc(n.name)}</h4>
    ${p.desc ? `<p>${esc(p.desc)}</p>` : ''}
    <dl class="kv">
      <dt>入住</dt><dd class="mono">${esc(b.checkin)}</dd>
      <dt>退房</dt><dd class="mono">${esc(b.checkout)}</dd>
      <dt>地址</dt><dd>${esc(n.addr)}</dd>
      ${n.tel ? `<dt>電話</dt><dd class="mono">${esc(n.tel)}</dd>` : ''}
      <dt>停車</dt><dd>${esc(b.parking)}</dd>
      <dt>入住須知</dt><dd>${esc(b.notes)}</dd>
      <dt>訂房狀態</dt><dd>${esc(b.status)}</dd>
    </dl>
    <div class="btns"><a class="btn primary" href="${esc(n.map)}" target="_blank" rel="noopener">Google 地圖 ↗</a>${copyBtn(n.addr)}${n.site ? `<a class="btn" href="${esc(n.site)}" target="_blank" rel="noopener">訂房頁 ↗</a>` : ''}</div>
  </div></article>`;
}

function renderDay(d, i) {
  const slots = d.slots.map(s => {
    const thumb = !s.places.length && hasImg(s.img) ? `<img class="thumb" src="${imgSrc(s.img)}" alt="" loading="lazy">` : '';
    const text = s.text && s.text !== '—' ? `<p class="txt">${esc(s.text)}</p>` : `<p class="txt empty">尚未安排</p>`;
    return `<li class="slot${MEALS.has(s.key) ? ' meal' : ''}">
      <div class="rail"><span class="dot">${slotShort[s.key]}</span></div>
      <div class="body">
        <h3>${esc(s.label)}</h3>
        <div class="row">${text}${thumb}</div>
        ${s.places.length ? `<div class="cards">${s.places.map(placeCard).join('')}</div>` : ''}
        ${s.link ? `<a class="extlink" href="${esc(s.link)}" target="_blank" rel="noopener">行程表連結 ↗</a>` : ''}
        ${navBox(s.nav)}
      </div></li>`;
  }).join('');
  const end = d.hotel.length ? `<div class="hotels">${d.hotel.map(hotelCard).join('')}</div>` : `<p class="endnote">20:10 抵達桃園第二航廈 · 旅程結束，平安回家 🏠</p>`;
  return `<div class="dayhead">
      <div class="eyebrow">DAY ${i + 1} · ${esc(d.date)}</div>
      <h2>${esc(d.area)}</h2>
      <p class="route">${esc(d.route)}</p>
      <div class="facts">
        ${d.drive ? `<div class="fact"><span class="k">車程・休息站</span>${esc(d.drive)}</div>` : ''}
        ${d.elder && d.elder !== '待定' ? `<div class="fact elder"><span class="k">長輩注意</span>${esc(d.elder)}</div>` : ''}
      </div>
    </div>
    <ol class="timeline">${slots}</ol>
    ${end}`;
}

const fmt = n => typeof n === 'number' ? n.toLocaleString('zh-TW', {maximumFractionDigits: 0}) : esc(n);
function renderBudget() {
  const b = DATA.budget, total = (b.summary.byCat.find(c => c[0] === '總計') || [, 0])[1];
  const per = (b.summary.byCat.find(c => c[0] === '每人') || [, 0])[1];
  const cats = b.summary.byCat.filter(c => !['總計','每人'].includes(c[0]));
  const tiles = `<div class="tiles">
    <div class="tile main"><div class="k">總計（台幣）</div><div class="v">${fmt(total)}</div></div>
    <div class="tile"><div class="k">每人（${b.people} 人）</div><div class="v">${fmt(per)}</div></div>
    ${cats.map(c => `<div class="tile"><div class="k">${esc(c[0])}</div><div class="v">${fmt(c[1])}</div></div>`).join('')}
  </div>`;
  let rows = '', last = '';
  for (const it of b.items) {
    if (it.cat !== last) { rows += `<tr class="group"><td colspan="6">${esc(it.cat)}</td></tr>`; last = it.cat; }
    const done = /已/.test(it.status || '');
    rows += `<tr><td class="mono">${esc(it.date)}</td><td>${esc(it.item)}<span class="desc">${esc(it.desc)}</span></td>
      <td class="num">${it.cur === 'JPY' ? '¥' : 'NT$'}${fmt(it.amt)}</td><td class="num">${fmt(it.twd)}</td>
      <td><span class="pill ${done ? 'done' : 'todo'}">${esc(it.status)}</span></td><td>${esc(it.payer)}</td></tr>`;
  }
  rows += `<tr class="total"><td colspan="3">合計</td><td class="num">${fmt(total)}</td><td colspan="2"></td></tr>`;
  const payers = b.summary.byPayer.map(p => `<tr><td>${esc(p[0])}</td><td class="num">${fmt(p[1])}</td></tr>`).join('');
  return `<h2 class="sec">旅費預算</h2>
    <p class="muted" style="margin:0">${esc(b.title)}<br>匯率 JPY→TWD ${b.rate}（${esc(b.rateNote)}）</p>
    ${tiles}
    <h3 class="sub">明細</h3>
    <div class="tablewrap"><table><thead><tr><th>日期</th><th>項目・說明</th><th class="num">金額</th><th class="num">台幣</th><th>狀態</th><th>付款人</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="margin:0;font-size:.85rem">機票小計依試算表公式，比明細多計 1 張 NT$12,091；餐費、油錢、過路費、門票尚未列入。</p>
    <h3 class="sub">付款人小計</h3>
    <div class="tablewrap"><table><thead><tr><th>付款人</th><th class="num">台幣</th></tr></thead><tbody>${payers}</tbody></table></div>`;
}

function packKey(g, i) { return `pack-${g}-${i}`; }
function loadChecks() { try { return JSON.parse(localStorage.getItem('kyushu-pack') || '{}'); } catch { return {}; } }
function saveChecks(o) { try { localStorage.setItem('kyushu-pack', JSON.stringify(o)); } catch {} }
function renderPack() {
  const c = loadChecks(), total = PACK.reduce((n, g) => n + g.items.length, 0);
  const done = Object.values(c).filter(Boolean).length;
  return `<h2 class="sec">行李清單</h2>
    <p class="muted" style="margin:0">依我們家的成員準備：85 歲的阿嬤、1 歲的寶寶，還有幾位很怕冷的人。勾選只會存在你自己的手機上。</p>
    <p class="progress" id="packprog">已準備 ${done} / ${total} 項</p>
    <div class="packgrid">${PACK.map((g, gi) => `<div class="pack"><h3>${esc(g.t)}</h3><p class="who">${esc(g.who)}</p><ul>
      ${g.items.map((it, ii) => { const k = packKey(gi, ii); return `<li><label for="${k}"><input type="checkbox" id="${k}" data-k="${k}"${c[k] ? ' checked' : ''}><span>${esc(it[0])}<span class="why">${esc(it[1])}</span></span></label></li>`; }).join('')}
    </ul></div>`).join('')}</div>`;
}

/* ---- tabs ---- */

  {id: 'budget', html: '<span aria-hidden="true">💴</span> 預算', extra: true, sep: true, render: renderBudget},
  {id: 'packing', html: '<span aria-hidden="true">🧳</span> 行李', extra: true, render: renderPack}];

function todayId() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  if (y === 2027 && m === 1 && d >= 10 && d <= 19) return `d1${String(d).padStart(2, '0')}`;
  return null;
}
const tabEls = {};
const list = document.getElementById('tablist'), panel = document.getElementById('panel');
const tId = todayId();
for (const t of TABS) {
  if (t.sep) { const hr = document.createElement('div'); hr.className = 'tabsep'; hr.setAttribute('role', 'presentation'); list.appendChild(hr); }
  const b = document.createElement('button');
  b.className = 'tab' + (t.extra ? ' extra' : '') + (t.id === tId ? ' today' : '');
  b.setAttribute('role', 'tab'); b.id = 'tab-' + t.id; b.innerHTML = t.html;
  b.addEventListener('click', () => show(t.id, true));
  list.appendChild(b); tabEls[t.id] = b;
}
function show(id, user) {
  const t = TABS.find(x => x.id === id) || TABS[0];
  for (const k in tabEls) tabEls[k].setAttribute('aria-selected', String(k === t.id));
  panel.innerHTML = `<section role="tabpanel" aria-labelledby="tab-${t.id}">${t.render()}</section>`;
  const el = tabEls[t.id];
  if (list.scrollWidth > list.clientWidth) list.scrollLeft = el.offsetLeft - list.clientWidth / 2 + el.offsetWidth / 2;
  if (user) { window.scrollTo({top: 0}); try { history.replaceState(null, '', '#' + t.id); } catch {} }
}
panel.addEventListener('click', e => {
  const btn = e.target.closest('[data-copy]'); if (!btn) return;
  const txt = btn.dataset.copy;
  navigator.clipboard?.writeText(txt).then(() => { btn.textContent = '已複製'; setTimeout(() => btn.textContent = '複製', 1500); })
    .catch(() => { btn.textContent = txt; });
});
panel.addEventListener('change', e => {
  const k = e.target.dataset?.k; if (!k) return;
  const c = loadChecks(); c[k] = e.target.checked; saveChecks(c);
  const total = PACK.reduce((n, g) => n + g.items.length, 0);
  document.getElementById('packprog').textContent = `已準備 ${Object.values(c).filter(Boolean).length} / ${total} 項`;
});
document.getElementById('maplink').href = DATA.mapLink;
document.getElementById('ppl').textContent = DATA.budget.people;

/* ---- day / night ---- */
const root = document.documentElement, themeBtn = document.getElementById('themebtn');
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : darkMQ.matches;
function paintThemeBtn() {
  const d = isDark();
  themeBtn.querySelector('.ic').textContent = d ? '☀️' : '🌙';
  themeBtn.querySelector('.lb').textContent = d ? '白天模式' : '夜間模式';
  themeBtn.setAttribute('aria-pressed', String(d));
}
themeBtn.addEventListener('click', () => {
  root.dataset.theme = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('kyushu-theme', root.dataset.theme); } catch {}
  paintThemeBtn();
});
darkMQ.addEventListener?.('change', paintThemeBtn);
paintThemeBtn();

/* ---- font preview ---- */
const fontPick = document.getElementById('fontpick');
fontPick.value = root.dataset.font || 'huninn';
fontPick.addEventListener('change', () => {
  root.dataset.font = fontPick.value;
  try { localStorage.setItem('kyushu-font', fontPick.value); } catch {}
});
show(location.hash.slice(1) || tId || TABS[0].id);
